<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2545" viewBox="0 0 1200 2545">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F9AA2"/>
      <stop offset="0.22" stop-color="#F7FAFB"/>
      <stop offset="0.48" stop-color="#AEB8BF"/>
      <stop offset="0.74" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7D8992"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#55D6D5"/>
    </marker>
  </defs>
  <style>
    .eyebrow{font-family:Manrope,Arial,sans-serif;font-size:31px;font-weight:700;letter-spacing:6px;fill:#159AA1}
    .title{font-family:Manrope,Arial,sans-serif;font-size:84px;font-weight:800;letter-spacing:-2px;fill:#073747}
    .subtitle{font-family:Manrope,Arial,sans-serif;font-size:34px;font-weight:450;fill:#42616D}
    .step{font-family:Manrope,Arial,sans-serif;font-size:33px;font-weight:800;fill:#FFFFFF;text-anchor:middle;dominant-baseline:middle}
    .cardtitle{font-family:Manrope,Arial,sans-serif;font-size:42px;font-weight:800;fill:#073747}
    .body{font-family:Manrope,Arial,sans-serif;font-size:29px;font-weight:450;fill:#42616D}
    .foot{font-family:Manrope,Arial,sans-serif;font-size:27px;font-weight:650;fill:#073747;text-anchor:middle}
    .icon{fill:none;stroke:#073747;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
    .aqua{fill:none;stroke:#55D6D5;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="1200" height="2545" fill="#EFF8F7"/>
  <text class="eyebrow" x="82" y="105">WATER CIRCULATION</text>
  <text class="title" x="78" y="205">How Zinc’d Works</text>
  <text class="subtitle" x="82" y="265">A clear five-stage treatment path.</text>
  <line x1="82" y1="305" x2="1118" y2="305" stroke="#55D6D5" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Stage 1 -->
  <g>
    <rect x="74" y="355" width="1052" height="320" rx="34" fill="#FFFFFF" stroke="#D5EAE9" stroke-width="3"/>
  </g>
  <circle cx="142" cy="421" r="38" fill="#0B5CA8"/>
  <text class="step" x="142" y="425">1</text>
  <g transform="translate(220 405)">
    <rect class="icon" x="0" y="28" width="230" height="142" rx="20"/>
    <path class="aqua" d="M22 88 C51 65 80 65 109 88 C138 111 167 111 208 82"/>
    <path class="aqua" d="M22 126 C51 103 80 103 109 126 C138 149 167 149 208 120" opacity="0.75"/>
    <path class="icon" d="M177 28 V-5 M213 28 V-5 M177 10 H213"/>
  </g>
  <text class="cardtitle" x="510" y="438">Swimming pool</text>
  <text class="body" x="510" y="501">Pool water enters the circulation</text>
  <text class="body" x="510" y="543">system for continuous treatment.</text>

  <line x1="600" y1="690" x2="600" y2="731" stroke="#55D6D5" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="74" y="745" width="1052" height="320" rx="34" fill="#FFFFFF" stroke="#D5EAE9" stroke-width="3"/>
  </g>
  <circle cx="142" cy="811" r="38" fill="#0B5CA8"/>
  <text class="step" x="142" y="815">2</text>
  <g transform="translate(218 788)">
    <path class="icon" d="M-5 100 H38 M190 100 H244"/>
    <circle class="icon" cx="114" cy="100" r="78"/>
    <path class="aqua" d="M114 55 C150 57 166 85 151 116 C135 148 91 151 71 119 C53 89 73 57 114 55 Z"/>
    <path class="icon" d="M114 55 L130 99 L151 116 M114 55 L91 93 L71 119 M91 93 L130 99"/>
  </g>
  <text class="cardtitle" x="510" y="828">Circulation pump</text>
  <text class="body" x="510" y="891">The pump moves water through</text>
  <text class="body" x="510" y="933">the pool’s treatment line.</text>

  <line x1="600" y1="1080" x2="600" y2="1121" stroke="#55D6D5" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="74" y="1135" width="1052" height="320" rx="34" fill="#FFFFFF" stroke="#D5EAE9" stroke-width="3"/>
  </g>
  <circle cx="142" cy="1201" r="38" fill="#0B5CA8"/>
  <text class="step" x="142" y="1205">3</text>
  <g transform="translate(234 1172)">
    <ellipse class="icon" cx="104" cy="45" rx="78" ry="28"/>
    <path class="icon" d="M26 45 V190 C26 211 61 228 104 228 C147 228 182 211 182 190 V45"/>
    <path class="aqua" d="M48 98 H160 M48 136 H160 M48 174 H160"/>
    <path class="icon" d="M-18 70 H26 M182 190 H226"/>
  </g>
  <text class="cardtitle" x="510" y="1218">Pool filter</text>
  <text class="body" x="510" y="1281">The filter removes suspended debris</text>
  <text class="body" x="510" y="1323">before ionization takes place.</text>

  <line x1="600" y1="1470" x2="600" y2="1511" stroke="#55D6D5" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g>
    <rect x="74" y="1525" width="1052" height="320" rx="34" fill="#FFFFFF" stroke="#BFE1DF" stroke-width="5"/>
  </g>
  <circle cx="142" cy="1591" r="38" fill="#0B5CA8"/>
  <text class="step" x="142" y="1595">4</text>
  <g transform="translate(198 1555)">
    <rect x="52" y="0" width="194" height="126" rx="18" fill="#F8FAFB" stroke="#073747" stroke-width="9"/>
    <rect x="86" y="22" width="126" height="35" rx="5" fill="#0B5CA8"/>
    <circle cx="113" cy="92" r="15" fill="#C97832"/>
    <circle cx="149" cy="92" r="15" fill="#A9B0B7"/>
    <circle cx="185" cy="92" r="15" fill="#1D63B7"/>
    <path d="M107 126 V153 M191 126 V153" stroke="#073747" stroke-width="7"/>
    <rect x="0" y="154" width="300" height="66" rx="29" fill="url(#metal)" stroke="#687781" stroke-width="6"/>
    <rect x="48" y="121" width="58" height="68" rx="12" fill="url(#metal)" stroke="#687781" stroke-width="6"/>
    <rect x="196" y="121" width="58" height="68" rx="12" fill="url(#metal)" stroke="#687781" stroke-width="6"/>
    <path d="M-25 187 H0 M300 187 H325" stroke="#073747" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text class="cardtitle" x="570" y="1608">Zinc’d ionization</text>
  <text class="body" x="570" y="1671">The chamber applies controlled copper,</text>
  <text class="body" x="570" y="1713">silver and zinc ionization to the flow.</text>

  <line x1="600" y1="1860" x2="600" y2="1901" stroke="#55D6D5" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <g>
    <rect x="74" y="1915" width="1052" height="320" rx="34" fill="#FFFFFF" stroke="#D5EAE9" stroke-width="3"/>
  </g>
  <circle cx="142" cy="1981" r="38" fill="#0B5CA8"/>
  <text class="step" x="142" y="1985">5</text>
  <g transform="translate(218 1950)">
    <path class="icon" d="M26 8 V220 M26 64 H198 V220 H26"/>
    <circle class="icon" cx="70" cy="120" r="24"/>
    <path class="aqua" d="M94 120 C133 92 170 92 222 120"/>
    <path class="aqua" d="M96 154 C143 132 178 135 230 164" opacity="0.7"/>
    <path class="icon" d="M-15 120 H45"/>
  </g>
  <text class="cardtitle" x="510" y="1998">Treated-water return</text>
  <text class="body" x="510" y="2061">The treated water returns to the pool</text>
  <text class="body" x="510" y="2103">through the normal circulation line.</text>

  <rect x="122" y="2321" width="956" height="100" rx="50" fill="#DDF2F1"/>
  <text class="foot" x="600" y="2382">Installed after filtration and before the pool return line.</text>
  <circle cx="523" cy="2477" r="25" fill="#C97832"/><circle cx="600" cy="2477" r="25" fill="#A9B0B7"/><circle cx="677" cy="2477" r="25" fill="#1D63B7"/>
  <text x="523" y="2485" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">Cu</text>
  <text x="600" y="2485" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">Ag</text>
  <text x="677" y="2485" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF">Zn</text>
</svg>
